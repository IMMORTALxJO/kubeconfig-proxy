name: PR kind e2e command

on:
  issue_comment:
    types: [created]

permissions:
  contents: none

jobs:
  prepare-check:
    name: prepare kind e2e check for PR #${{ github.event.issue.number }}
    if: >-
      github.event.issue.pull_request && github.event.comment.body == '/e2e' && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    outputs:
      check_run_id: ${{ steps.check-run.outputs.check_run_id }}
      head_sha: ${{ steps.pull-request.outputs.head_sha }}

    steps:
      - name: Resolve pull request head
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Create PR check
        id: check-run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
        run: |
          check_run_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='kind e2e' \
            -f head_sha="$HEAD_SHA" \
            -f status=in_progress \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq .id)"
          printf 'check_run_id=%s\n' "$check_run_id" >> "$GITHUB_OUTPUT"

  kind-e2e:
    name: kind e2e for PR #${{ github.event.issue.number }}
    needs: prepare-check
    if: needs.prepare-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pr-e2e-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-check.outputs.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run kind e2e suite
        id: run-kind-e2e
        env:
          KCP_SKIP_MAKE_CHECK: "1"
          KCP_E2E_CHECKS: context,aggregation,routing,rollout,subresources,watch,helm
        run: make e2e kind

  publish-check:
    name: publish kind e2e result for PR #${{ github.event.issue.number }}
    needs: [prepare-check, kind-e2e]
    if: always() && needs.prepare-check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - name: Publish PR check result
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ needs.prepare-check.outputs.check_run_id }}
          CHECK_CONCLUSION: ${{ needs.kind-e2e.result }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" \
            -f status=completed \
            -f conclusion="$CHECK_CONCLUSION"
