name: Kubernetes compatibility

on: workflow_dispatch

permissions:
  contents: read

jobs:
  routing:
    name: kubectl ${{ matrix.kubectl }}, Kubernetes ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kubectl: ["1.34", "1.35", "1.36"]
        cluster: ["1.34", "1.35", "1.36"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run routing compatibility suite
        env:
          KCP_SKIP_MAKE_CHECK: "1"
          KCP_SKIP_WERF: "1"
          KCP_E2E_CHECKS: context,aggregation,routing,rollout,subresources,watch,helm
          KCP_E2E_PREFIX: compat
          KCP_KUBECTL_VERSION_PROFILE: ${{ matrix.kubectl }}
          KCP_CLUSTER_A_VERSION_PROFILE: ${{ matrix.cluster }}
          KCP_CLUSTER_B_VERSION_PROFILE: ${{ matrix.cluster }}
        run: e2e/run.sh
